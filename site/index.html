<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Critique & Play - Avaliações de Jogos e Animes</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="header-content">
            <a href="#" class="logo">
                <i class="fa-solid fa-gamepad"></i> Critique & Play
            </a>
            <div class="nav-links">
                <a href="#" class="btn-nav active"><i class="fa-solid fa-layer-group"></i> Catálogo</a>
            </div>
        </div>
    </header>

    <main class="main-wrapper">
        <!-- Hero Section -->
        <section class="hero-banner">
            <h1>Catálogo de Jogos e Animes</h1>
            <p>Acompanhe os lançamentos de jogos e as informações atualizadas dos seus animes favoritos diretamente da nossa API!</p>
        </section>

        <!-- Barra de Busca e Filtros -->
        <section id="reviews" class="controls-bar">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Pesquisar por título, sinopse ou estúdio...">
            </div>
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="todos"><i class="fa-solid fa-border-all"></i> Todos</button>
                <button class="filter-btn" data-filter="jogo"><i class="fa-solid fa-gamepad"></i> Jogos</button>
                <button class="filter-btn" data-filter="anime"><i class="fa-solid fa-tv"></i> Animes</button>
            </div>
        </section>

        <!-- Container de Itens -->
        <section>
            <div class="section-header">
                <h3 class="section-title">
                    <i class="fa-solid fa-list-check"></i> Itens Disponíveis
                </h3>
            </div>

            <div class="reviews-grid" id="itemsContainer">
                <!-- Os cards da API serão inseridos dinamicamente aqui -->
            </div>
        </section>
    </main>

    <!-- Elemento Toast para notificações de erro/sucesso -->
    <div id="toast" class="toast">
        <i class="fa-solid fa-circle-info"></i> <span id="toastMsg">Carregando dados da API...</span>
    </div>

    <footer>
        <p>&copy; 2026 Critique & Play - Conectado ao servidor local.</p>
    </footer>

    <script>
        const BASE_URL = 'http://localhost:3000';

        // Estado da aplicação
        let apiItems = [];
        let activeFilter = 'todos';
        let searchQuery = '';

        // Elementos do DOM
        const itemsContainer = document.getElementById('itemsContainer');
        const searchInput = document.getElementById('searchInput');
        const filterBtns = document.querySelectorAll('.filter-btn');
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toastMsg');

        // 1. Funções de Busca na API
        async function fetchJogos() {
            const response = await fetch(`${BASE_URL}/jogos`);
            if (!response.ok) throw new Error(`Erro ao buscar jogos: HTTP ${response.status}`);
            const jogos = await response.json();
            return jogos.map(jogo => ({ ...jogo, tipo: 'jogo' }));
        }

        async function fetchAnimes() {
            const response = await fetch(`${BASE_URL}/anime`);
            if (!response.ok) throw new Error(`Erro ao buscar animes: HTTP ${response.status}`);
            const animes = await response.json();
            return animes.map(anime => ({ ...anime, tipo: 'anime' }));
        }

        async function loadAPIData() {
            showToast("Carregando dados do servidor...");
            itemsContainer.innerHTML = `
                <div class="empty-state">
                    <i class="fa-solid fa-spinner fa-spin"></i>
                    <h3>Conectando à API...</h3>
                    <p>Buscando lista de jogos e animes.</p>
                </div>
            `;

            try {
                const [jogos, animes] = await Promise.all([fetchJogos(), fetchAnimes()]);
                apiItems = [...jogos, ...animes];
                renderItems();
            } catch (error) {
                console.error("Erro na integração:", error);
                itemsContainer.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-triangle-exclamation" style="color: #e11d48;"></i>
                        <h3>Falha ao carregar dados</h3>
                        <p>Certifique-se de que o servidor está rodando em <strong>${BASE_URL}</strong>.</p>
                    </div>
                `;
            }
        }

        // 2. Renderização dos cards na tela
        function renderItems() {
            itemsContainer.innerHTML = '';

            const filteredItems = apiItems.filter(item => {
                const matchesFilter = activeFilter === 'todos' || item.tipo === activeFilter;
                
                const searchLower = searchQuery.toLowerCase();
                const matchesSearch = item.titulo.toLowerCase().includes(searchLower) ||
                                      (item.sinopse && item.sinopse.toLowerCase().includes(searchLower)) ||
                                      (item.estudio && item.estudio.toLowerCase().includes(searchLower));

                return matchesFilter && matchesSearch;
            });

            if (filteredItems.length === 0) {
                itemsContainer.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-folder-open"></i>
                        <h3>Nenhum item encontrado</h3>
                        <p>Tente ajustar a sua busca ou alterar os filtros da página.</p>
                    </div>
                `;
                return;
            }

            filteredItems.forEach(item => {
                const card = document.createElement('div');
                card.className = 'review-card';

                if (item.tipo === 'jogo') {
                    // Formatação da data de lançamento do jogo
                    const dataFormatada = item.data_lançamento 
                        ? new Date(item.data_lançamento).toLocaleDateString('pt-BR') 
                        : 'Data não informada';

                    card.innerHTML = `
                        <div>
                            <div class="card-top">
                                <span class="badge badge-game">
                                    <i class="fa-solid fa-gamepad"></i> Jogo
                                </span>
                            </div>
                            <h4 class="card-title">${escapeHTML(item.titulo)}</h4>
                            <div class="card-subtitle">
                                <i class="fa-solid fa-calendar-day"></i> Lançamento: ${dataFormatada}
                            </div>
                            <p class="card-comment">${escapeHTML(item.sinopse || '')}</p>
                        </div>
                        <div class="card-footer">
                            <div class="reviewer-info">
                                <i class="fa-solid fa-hashtag"></i> ID: ${item.id}
                            </div>
                        </div>
                    `;
                } else {
                    // Renderização específica para Animes
                    card.innerHTML = `
                        <div>
                            <div class="card-top">
                                <span class="badge badge-anime">
                                    <i class="fa-solid fa-tv"></i> Anime
                                </span>
                                <div class="rating-badge">
                                    <i class="fa-solid fa-film"></i> ${item.numero_episodios || 0} eps
                                </div>
                            </div>
                            <h4 class="card-title">${escapeHTML(item.titulo)}</h4>
                            <div class="card-subtitle">
                                <i class="fa-solid fa-building"></i> ${escapeHTML(item.estudio || 'Desconhecido')}
                            </div>
                            <p class="card-comment">${escapeHTML(item.sinopse || '')}</p>
                        </div>
                        <div class="card-footer">
                            <div class="reviewer-info">
                                <i class="fa-solid fa-info-circle"></i> Status: ${escapeHTML(item.status || 'N/A')}
                            </div>
                        </div>
                    `;
                }

                itemsContainer.appendChild(card);
            });
        }

        // 3. Eventos da Interface (Filtros e Busca)
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                activeFilter = btn.getAttribute('data-filter');
                renderItems();
            });
        });

        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value;
            renderItems();
        });

        // Utilitários
        function showToast(message) {
            toastMsg.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function escapeHTML(str) {
            return String(str).replace(/[&<>'"]/g, 
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag] || tag)
            );
        }

        // Inicialização ao carregar a página
        window.onload = loadAPIData;
    </script>
</body>
</html>
