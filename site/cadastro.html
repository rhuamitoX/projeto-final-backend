<body>

<div class="container">
    <h1>Cadastro de Clientes</h1>
    
    

    <form id="form_cadastro">
        <div class="field-group full-width">
            <label for="nome">Nome Completo</label>
            <input type="text" id="nome" placeholder="Digite seu nome completo" required>
        </div>

        <div class="field-group">
            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="exemplo@email.com" required>
        </div>

        <div class="field-group">
            <label for="celular">Celular</label>
            <input type="tel" id="celular" placeholder="(42) 99999-9999" required>
        </div>

        <div class="field-group">
            <label for="CPF">CPF</label>
            <input type="text" id="CPF" placeholder="000.000.000-00" required>
        </div>

        <!--   
        <div class="field-group">
            <label for="CEP">CEP</label>
            <input type="text" id="CEP" onblur="pesquisarCep()" placeholder="00000-000" required>
        </div>

        <div class="field-group full-width">
            <label for="Rua">Rua</label>
            <input type="text" id="Rua" placeholder="Rua, Avenida, etc." required>
        </div>

        <div class="field-group">
            <label for="Número">Número</label>
            <input type="number" id="Número" placeholder="Nº" required>
        </div>

        <div class="field-group">
            <label for="Bairro">Bairro</label>
            <input type="text" id="Bairro" placeholder="Nome do bairro" required>
        </div>

        <div class="field-group">
            <label for="Cidade">Cidade</label>
            <input type="text" id="Cidade" placeholder="Sua cidade" required>
        </div>

        <div class="field-group">
            <label for="UF">UF</label>
            <input type="text" id="UF" placeholder="Sigla (ex: SP)" maxlength="2" required>
        </div>
        -->

        <div class="field-group full-width">
            <label for="Senha">Senha</label>
            <input type="password" id="Senha" placeholder="Crie uma senha segura" required>
        </div>

        <button type="submit" id="btn_enviar" class="btn-submit">Cadastrar Cliente</button>
    </form>
</div>


<script>
    function pegar_dados() {
        const dados = {
            nome: document.getElementById("nome").value,
            cpf: document.getElementById("CPF").value,
            celular: document.getElementById("celular").value,
            email: document.getElementById("email").value,
            senha: document.getElementById("Senha").value
        }
        return dados
    }
    const form = document.getElementById("form_cadastro")
    const btn_enviar = document.getElementById("btn_enviar")
    form.addEventListener("submit", async (event) => {
        event.preventDefault() // evita o recarregamento da página
        btn_enviar.disabled = true
        btn_enviar.value = "Enviando..."
        const dados = pegar_dados()
        try {
            const resposta = await fetch(
                "http://10.216.243.142:3000/cliente", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(dados)
                }
            )
            if (!resposta.ok) throw new Error("Erro na API")
            alert("O cadastro foi realizado!")
            form.reset()
        } catch (error) {
            alert(error)
        } finally {
            btn_enviar.disabled = false
            btn_enviar.value = "Enviar Cadastro"
        }
    })
</script>
</body>
</html>
