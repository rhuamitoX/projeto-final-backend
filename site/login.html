<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <header>
        <div class="header-content">
            <a href="#" class="logo">
                <i class="fa-solid fa-gamepad"></i> Critique & Play
            </a>
            <div class="nav-links">
                <a href="login.html" class="btn-nav"><i class="fa-solid fa-user"></i> Login</a>
                <a href="index.html" class="btn-nav"><i class="fa-solid fa-layer-group"></i> Ver Reviews</a>
                <a href="index.html" class="btn-nav active"><i class="fa-solid fa-plus"></i> Nova Avaliação</a>
            </div>
        </div>
    </header>

<div class="container">
    <h1>Login</h1>
    
    <form id="form_login">
       

        <div class="field-group full-width">
            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="exemplo@email.com" required>
        </div>

     

        

        <div class="field-group full-width">
            <label for="Senha">Senha</label>
            <input type="password" id="Senha" placeholder="Crie uma senha segura" required>
        </div>

        <div class="field-group full-width">
            <p>Não possui cadastro?<a href="cadastro.html">clique aqui</a></p>
        </div>

        <button type="submit" id="btn_enviar" class="btn-submit">Login</button>
    </form>
</div>
<script>
    function pegar_dados() {
        const dados = {
            
            email: document.getElementById("email").value,
            senha: document.getElementById("Senha").value
        }
        return dados
    }
    const form = document.getElementById("form_login")
    const btn_enviar = document.getElementById("btn_enviar")
    form.addEventListener("submit", async (event) => {
        event.preventDefault() // evita o recarregamento da página
        btn_enviar.disabled = true
        btn_enviar.value = "Enviando..."
        const dados = pegar_dados()
        try {
            const resposta = await fetch(
                "http://10.216.243.142:3000/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(dados)
                }
            )
            if (!resposta.ok) throw new Error("Erro na API")
            alert("O login foi realizado!")
            form.reset()
        } catch (error) {
            alert(error)
        } finally {
            btn_enviar.disabled = false
            btn_enviar.value = "Enviar Cadastro"
        }
    })
</script>
</body>
</html>
